<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <style>
    @keyframes spin-asterisk {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-core {
      0%, 100% { r: 10px; opacity: 1; }
      50% { r: 13px; opacity: 0.85; }
    }
    .asterisk-arms {
      transform-origin: 0 0;
      animation: spin-asterisk 14s linear infinite;
    }
    .asterisk-core {
      animation: pulse-core 2s ease-in-out infinite;
    }
  </style>
  <rect x="-100" y="-100" width="200" height="200" rx="46" fill="#080B11" />
  <g class="asterisk-arms" fill="#FFFFFF">
    <polygon points="-7,-18 7,-18 3.5,-92 -3.5,-92" transform="rotate(0)" />
    <polygon points="-7,-18 7,-18 3.5,-92 -3.5,-92" transform="rotate(60)" />
    <polygon points="-7,-18 7,-18 3.5,-92 -3.5,-92" transform="rotate(120)" />
    <polygon points="-7,-18 7,-18 3.5,-92 -3.5,-92" transform="rotate(180)" />
    <polygon points="-7,-18 7,-18 3.5,-92 -3.5,-92" transform="rotate(240)" />
    <polygon points="-7,-18 7,-18 3.5,-92 -3.5,-92" transform="rotate(300)" />
  </g>
  <circle class="asterisk-core" cx="0" cy="0" r="10" fill="#FF553D" />
</svg>
